<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon - Book a Table</title>

    <meta property="og:title" content="Our Menu">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <meta property="og:url" content="https://littlelemon/">
    <meta property="og:description"
        content="Little Lemon is a family-owned Mediterranean restaurant, focused on traditional recipes served with a modern twist.">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="Little Lemon">

    <link rel="stylesheet" href="style_limon.css">
</head>

<body>
    <header>
        <img src="Asset 9@4x.png" width="100" alt="Little Lemon logo">
    </header>

    <nav aria-label="Main Navigation">
        <ul>
            <li><a href="index.html" class="active" aria-current="page">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <h1 id="form-heading">Book a Table</h1>

        <!-- Status message container for form submission feedback -->
        <div id="form-status" role="status" aria-live="polite"></div>

        <!-- Hidden iframe captures the Google Form response -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"
            onload="if(submitted){ handleFormResponse(); }"></iframe>

        <!-- Native HTML submission pointing to Google Forms -->
        <form id="booking-form"
            action="https://docs.google.com/forms/d/1JG6tEcdYPR2qWokPW4KFyw0IkGt7891aeMsl8CcObkg/formResponse"
            method="POST" target="hidden_iframe" onsubmit="submitted = true;" aria-labelledby="form-heading">

            <div>
                <label for="booking_date">Booking Date</label>
                <input type="date" id="booking_date" name="entry.1966042984" required aria-required="true">
            </div>

            <div>
                <label for="booking_people">Number of people</label>
                <input type="range" id="booking_people" name="entry.103849891" min="1" max="10" value="4"
                    aria-describedby="people-output"
                    oninput="document.getElementById('people-output').value = this.value">
                <output id="people-output" for="booking_people" aria-live="polite">4</output>
            </div>

            <div>
                <label for="booking_location">Branch Location</label>
                <input id="booking_location" name="entry.2014176179" list="branch-list">
                <datalist id="branch-list">
                    <option value="Downtown"></option>
                </datalist>
            </div>

            <fieldset id="size">
                <legend>Table Size</legend>
                <input type="radio" id="size-2" value="2" name="entry.22341789">
                <label for="size-2">2-person table</label>

                <input type="radio" id="size-4" value="4" name="entry.22341789">
                <label for="size-4">4-person table</label>

                <input type="radio" id="size-6" value="6" name="entry.22341789">
                <label for="size-6">6-person table</label>
            </fieldset>

            <fieldset id="location">
                <legend>Location</legend>
                <input type="radio" id="location-indoors" value="indoors" name="entry.1001779990">
                <label for="location-indoors">Indoors</label>

                <input type="radio" id="location-outdoors" value="outdoors" name="entry.1001779990">
                <label for="location-outdoors">Outdoors</label>
            </fieldset>

            <div>
                <label for="username">Username</label>
                <input type="text" id="username" name="entry.697096437" autocomplete="username" required
                    aria-required="true" minlength="2">
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="entry.344095484" autocomplete="current-password" required
                    aria-required="true" minlength="2">
            </div>

            <br>
            <button type="submit">Book Table</button>
        </form>
    </main>

    <script>
        let submitted = false;

        function handleFormResponse() {
            const statusDiv = document.querySelector('#form-status');
            const form = document.querySelector('#booking-form');

            statusDiv.textContent = 'Table successfully booked!';
            statusDiv.style.color = 'green';
            form.reset();
            document.querySelector('#people-output').value = '4';

            submitted = false;
        }
    </script>
</body>

</html>
